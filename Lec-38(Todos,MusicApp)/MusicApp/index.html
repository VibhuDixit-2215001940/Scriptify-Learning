<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/b5d2174acd.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="container">
        <h1>Music Player!!</h1>
        <ul id="songList"></ul>
        <div id="play-section">
            <input style="width: auto;" type="range" id="progress" placeholder="0">
            <button><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn"><i class="fa-regular fa-circle-play"></i></button>
            <button><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </section>
    <script src="app.js"></script>
</body>
</html>
